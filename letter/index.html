  <style>html,body{margin:0;height:100%;background:#0b0b0c;color:#f2efe9;font-family:system-ui,sans-serif}.msg{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:2rem}.msg[hidden]{display:none}.msg h1{font-size:1.4rem;margin:0 0 .5rem}.msg p{color:#8d8a85;margin:0 0 1.2rem}.msg a{color:#f2efe9;border:1px solid #2a2a2c;padding:.6rem 1.1rem;text-decoration:none}.spin{width:28px;height:28px;border:3px solid #2a2a2c;border-top-color:#d6322d;border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style>
