# Membangun APK Android (Capacitor) aplikasi KANASA AI dan menaruhnya di Release "ai-android-latest".
name: AI Company — build APK

on:
  push:
    branches: ["main"]
    paths: ["ai-company/app/**", ".github/workflows/ai-android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-company/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ai-company/app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run build:android
      - run: npx cap sync android
      - name: Gradle assembleDebug
        working-directory: ai-company/app/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk kanasa-ai-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kanasa-ai-debug-apk
          path: ai-company/app/kanasa-ai-debug.apk
      - name: Publikasikan ke Release "ai-android-latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ai-android-latest
          name: Kanasa AI — APK Android terbaru (debug)
          prerelease: true
          make_latest: false
          files: ai-company/app/kanasa-ai-debug.apk
          body: |
            APK debug aplikasi KANASA STUDIO — Autonomous AI Company, dibangun otomatis dari commit ${{ github.sha }}.
            Cara pasang: unduh kanasa-ai-debug.apk di HP Android, izinkan "Instal aplikasi tidak dikenal" untuk browser, lalu buka file.
