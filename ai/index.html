<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>KANASA AI sudah pindah</title>
<link rel="canonical" href="https://kanasastudio.github.io/kanasa-ai/">
<meta http-equiv="refresh" content="0;url=https://kanasastudio.github.io/kanasa-ai/">
<style>body{font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;background:#f6f3ff;color:#2b2540;text-align:center;padding:24px}a{color:#6b4de6;font-weight:700}</style>
</head>
<body>
<div>
<p>KANASA AI sudah pindah ke alamat baru.</p>
<p><a href="https://kanasastudio.github.io/kanasa-ai/">kanasastudio.github.io/kanasa-ai</a></p>
<p style="font-size:14px;opacity:.75">Jika kamu sudah memasang versi lama, hapus ikon lamanya lalu instal lagi dari alamat baru.</p>
</div>
<script>
(async () => {
  try {
    if ("serviceWorker" in navigator) {
      for (const r of await navigator.serviceWorker.getRegistrations()) {
        if (new URL(r.scope).pathname.startsWith("/kanasastudio/ai/")) await r.unregister();
      }
    }
    if (window.caches) for (const k of await caches.keys()) if (/workbox|kanasa-ai/i.test(k)) await caches.delete(k);
  } catch (e) {}
  location.replace("https://kanasastudio.github.io/kanasa-ai/" + location.hash);
})();
</script>
</body>
</html>
