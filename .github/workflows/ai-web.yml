# Membangun ulang aplikasi KANASA AI (ai-company/app) ke folder /ai, lalu memicu deploy GitHub Pages website.
name: AI Company — build PWA

on:
  push:
    branches: ["main"]
    paths: ["ai-company/app/**", ".github/workflows/ai-web.yml"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ai-web
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ai-company/app/package-lock.json
      - name: Build
        working-directory: ai-company/app
        run: npm ci && npm run build
      - name: Salin ke /ai
        run: |
          rm -rf ai && mkdir ai && cp -r ai-company/app/dist/. ai/ && touch ai/.nojekyll
      - name: Commit hasil build
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "ai: build PWA dari ${GITHUB_SHA::7}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run static.yml --ref main
