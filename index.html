<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kanasa Studio × Dhandang Studio</title>
  <meta name="description" content="Commission 3D models, rigging, texturing and animation for Roblox.">
  <meta name="theme-color" content="#0b0b0c">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Kanasa Studio × Dhandang Studio">
  <meta property="og:description" content="Commission 3D models, rigging, texturing and animation for Roblox.">
  <meta property="og:image" content="assets/hero-mascot.png">
  <link id="favicon" rel="icon" href="assets/kanasa-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/site.css?v=20261024c">
  <script>document.documentElement.classList.remove("no-js")</script>
</head>
<body data-button="solid">
  <a class="skip" href="#app">Skip to content</a>
  <header class="site-header">
    <div class="container bar">
      <a class="brand" id="brand" href="#/" aria-label="Home"></a>
      <nav class="nav" id="nav" aria-label="Main"></nav>
      <div style="display:flex;gap:.6rem;align-items:center">
        <div class="seg" id="fx" role="group" aria-label="Display currency" hidden><button data-cur="IDR" aria-pressed="true">IDR</button><button data-cur="USD" aria-pressed="false">USD</button></div>
        <button class="btn ghost sm cart-btn" id="cart-open" aria-label="Open order cart">Order <span class="count" id="cart-count" hidden>0</span></button>
        <button class="btn ghost sm menu-btn" id="menu-btn" aria-label="Menu" aria-controls="nav" aria-expanded="false">Menu</button>
      </div>
    </div>
  </header>

  <main id="app" tabindex="-1"><div class="container page"><div class="skeleton" style="height:18rem"></div></div></main>

  <footer class="site-footer"><div class="container row">
    <span id="footer-text"></span><small class="muted" id="fx-note" style="flex-basis:100%"></small><ul id="footer-links"></ul>
  </div></footer>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-label="Order cart" inert>
    <header><strong>Your order</strong><button class="btn ghost sm" id="drawer-close">Close</button></header>
    <div class="body" id="drawer-body"></div>
    <footer><div style="display:flex;justify-content:space-between"><span class="muted">Estimate</span><strong id="drawer-total">—</strong></div>
      <a class="btn" id="drawer-go" href="#/order" hidden>Continue to brief</a></footer>
  </aside>

  <noscript><div class="container page">This site needs JavaScript to load services and orders.</div></noscript>
  <script type="module" src="js/app.js?v=20261024c"></script>
</body>
</html>
